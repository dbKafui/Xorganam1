# Local development stack. It has no HTTPS ingress; production must provide TLS.
x-tenant-email-environment: &tenant-email-environment
  TENANT_EMAIL_ENCRYPTION_KEYS: ${TENANT_EMAIL_ENCRYPTION_KEYS:?Set TENANT_EMAIL_ENCRYPTION_KEYS in the environment}
  TENANT_EMAIL_ACTIVE_KEY_VERSION: ${TENANT_EMAIL_ACTIVE_KEY_VERSION:?Set TENANT_EMAIL_ACTIVE_KEY_VERSION in the environment}
  EMAIL_CACHE_TTL_MS: ${EMAIL_CACHE_TTL_MS:?Set EMAIL_CACHE_TTL_MS in the environment}
  EMAIL_CACHE_MAX_ENTRIES: ${EMAIL_CACHE_MAX_ENTRIES:?Set EMAIL_CACHE_MAX_ENTRIES in the environment}
  EMAIL_SEND_TIMEOUT_MS: ${EMAIL_SEND_TIMEOUT_MS:?Set EMAIL_SEND_TIMEOUT_MS in the environment}
  EMAIL_SEND_ATTEMPTS: ${EMAIL_SEND_ATTEMPTS:?Set EMAIL_SEND_ATTEMPTS in the environment}
  EMAIL_SEND_BACKOFF_BASE_MS: ${EMAIL_SEND_BACKOFF_BASE_MS:?Set EMAIL_SEND_BACKOFF_BASE_MS in the environment}
  EMAIL_MAX_ATTACHMENT_BYTES: ${EMAIL_MAX_ATTACHMENT_BYTES:?Set EMAIL_MAX_ATTACHMENT_BYTES in the environment}
  EMAIL_MAX_RECIPIENTS: ${EMAIL_MAX_RECIPIENTS:?Set EMAIL_MAX_RECIPIENTS in the environment}
  EMAIL_WORKER_CONCURRENCY: ${EMAIL_WORKER_CONCURRENCY:?Set EMAIL_WORKER_CONCURRENCY in the environment}
  EMAIL_DELIVERY_RECORD_RETENTION_DAYS: ${EMAIL_DELIVERY_RECORD_RETENTION_DAYS:?Set EMAIL_DELIVERY_RECORD_RETENTION_DAYS in the environment}
  EMAIL_TEST_RATE_LIMIT: ${EMAIL_TEST_RATE_LIMIT:?Set EMAIL_TEST_RATE_LIMIT in the environment}
  EMAIL_TEST_RATE_WINDOW_MS: ${EMAIL_TEST_RATE_WINDOW_MS:?Set EMAIL_TEST_RATE_WINDOW_MS in the environment}
  EMAIL_SENDER_CHALLENGE_TTL_MS: ${EMAIL_SENDER_CHALLENGE_TTL_MS:?Set EMAIL_SENDER_CHALLENGE_TTL_MS in the environment}
  EMAIL_ALLOWED_SMTP_PORTS: ${EMAIL_ALLOWED_SMTP_PORTS:?Set EMAIL_ALLOWED_SMTP_PORTS in the environment}
  EMAIL_SMTP_STARTTLS_PORTS: ${EMAIL_SMTP_STARTTLS_PORTS:?Set EMAIL_SMTP_STARTTLS_PORTS in the environment}
  EMAIL_SMTP_IMPLICIT_TLS_PORT: ${EMAIL_SMTP_IMPLICIT_TLS_PORT:?Set EMAIL_SMTP_IMPLICIT_TLS_PORT in the environment}
  EMAIL_BLOCKED_SMTP_CIDRS: ${EMAIL_BLOCKED_SMTP_CIDRS:?Set EMAIL_BLOCKED_SMTP_CIDRS in the environment}
  EMAIL_SMTP_ENCRYPTION_MODES: ${EMAIL_SMTP_ENCRYPTION_MODES:?Set EMAIL_SMTP_ENCRYPTION_MODES in the environment}
  EMAIL_SMTP_ALLOW_INSECURE: ${EMAIL_SMTP_ALLOW_INSECURE:?Set EMAIL_SMTP_ALLOW_INSECURE in the environment}
  EMAIL_SES_REGIONS: ${EMAIL_SES_REGIONS:?Set EMAIL_SES_REGIONS in the environment}
  EMAIL_MAILGUN_REGIONS: ${EMAIL_MAILGUN_REGIONS:?Set EMAIL_MAILGUN_REGIONS in the environment}
  EMAIL_DEFAULT_PROVIDER: ${EMAIL_DEFAULT_PROVIDER:?Set EMAIL_DEFAULT_PROVIDER in the environment}
  EMAIL_DEFAULT_FROM_ADDRESS: ${EMAIL_DEFAULT_FROM_ADDRESS:?Set EMAIL_DEFAULT_FROM_ADDRESS in the environment}
  EMAIL_DEFAULT_FROM_NAME: ${EMAIL_DEFAULT_FROM_NAME:?Set EMAIL_DEFAULT_FROM_NAME in the environment}
  EMAIL_DEFAULT_SECRET_REFERENCE: ${EMAIL_DEFAULT_SECRET_REFERENCE:?Set EMAIL_DEFAULT_SECRET_REFERENCE in the environment}
  EMAIL_DEFAULT_SETTINGS_JSON: ${EMAIL_DEFAULT_SETTINGS_JSON:?Set EMAIL_DEFAULT_SETTINGS_JSON in the environment}
  EMAIL_CACHE_INVALIDATION_CHANNEL: ${EMAIL_CACHE_INVALIDATION_CHANNEL:?Set EMAIL_CACHE_INVALIDATION_CHANNEL in the environment}
  EMAIL_SENDGRID_API_URL: ${EMAIL_SENDGRID_API_URL:?Set EMAIL_SENDGRID_API_URL in the environment}
  EMAIL_MAILGUN_API_BASE_URLS_JSON: ${EMAIL_MAILGUN_API_BASE_URLS_JSON:?Set EMAIL_MAILGUN_API_BASE_URLS_JSON in the environment}

services:
  postgres:
    image: postgres:16-alpine
    container_name: xorganam-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: xorganam
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./xorganam-node-backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.18
    container_name: xorganam-vault
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    command: server -dev
    networks: [data]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.18
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: ["vault secrets enable -path=transit transit || true; vault read transit/keys/master-key >/dev/null 2>&1 || vault write transit/keys/master-key type=aes256-gcm96 derived=true"]
    networks: [data]

  redis:
    image: redis:7-alpine
    container_name: xorganam-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The bootstrap schema is intentionally a baseline. Apply all subsequent
  # numbered migrations before either API process starts using those tables.
  migrate:
    build:
      context: ./xorganam-node-backend
      dockerfile: Dockerfile
    container_name: xorganam-migrate
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@postgres:5432/xorganam
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run db:migrate
    networks: [data]

  backend:
    build:
      context: ./xorganam-node-backend
      dockerfile: Dockerfile
    container_name: xorganam-backend
    environment:
      <<: *tenant-email-environment
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@postgres:5432/xorganam
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:${BACKOFFICE_HOST_PORT:-5173},http://localhost:${CHECKOUT_HOST_PORT:-5174},http://localhost:${INSTITUTION_PORTAL_HOST_PORT:-5175}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY in the environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      EGANOW_BASE_URL: ""
      EGANOW_CALLBACK_URL: ${EGANOW_CALLBACK_URL:?Set EGANOW_CALLBACK_URL in the environment}
      EGANOW_DEBUG: "false"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    volumes:
      - kyc_uploads:/app/uploads/kyc
    command: npm start
    networks: [app, data]

  backend-worker:
    build:
      context: ./xorganam-node-backend
      dockerfile: Dockerfile
    container_name: xorganam-backend-worker
    environment:
      <<: *tenant-email-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@postgres:5432/xorganam
      REDIS_URL: redis://redis:6379
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY in the environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      EGANOW_BASE_URL: ""
      EGANOW_CALLBACK_URL: ${EGANOW_CALLBACK_URL:?Set EGANOW_CALLBACK_URL in the environment}
      EGANOW_DEBUG: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    command: npm run worker
    networks: [data, egress]

  backoffice-dashboard:
    build:
      context: ./backoffice-dashboard
      dockerfile: Dockerfile.static
      additional_contexts:
        shared: ./shared
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    container_name: xorganam-backoffice-dashboard
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    ports:
      - "127.0.0.1:${BACKOFFICE_HOST_PORT:-5173}:5173"
    networks: [app]

  checkout:
    build:
      context: ./xorganam-checkout
      dockerfile: Dockerfile.production
      additional_contexts:
        shared: ./shared
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
        VITE_BUILD_MODE: development
    container_name: xorganam-checkout
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    ports:
      - "127.0.0.1:${CHECKOUT_HOST_PORT:-5174}:5174"
    networks: [app]

  institution-portal:
    build:
      context: ./institution-portal
      dockerfile: Dockerfile.static
      additional_contexts:
        shared: ./shared
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    container_name: xorganam-institution-portal
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    ports:
      - "127.0.0.1:${INSTITUTION_PORTAL_HOST_PORT:-5175}:5175"
    depends_on:
      - backend
    networks: [app]

volumes:
  postgres_data:
  redis_data:
  kyc_uploads:

networks:
  app:
  data:
    internal: true
  egress:
