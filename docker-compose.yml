# Local development stack. It has no HTTPS ingress; production must provide TLS.
services:
  postgres:
    image: postgres:16-alpine
    container_name: xorganam-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: xorganam
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - type: volume
        source: xorganam1_postgres_data
        target: /var/lib/postgresql/data
      - ./xorganam-node-backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xorganam-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - type: volume
        source: xorganam1_redis_data
        target: /data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The bootstrap schema is intentionally a baseline. Apply all subsequent
  # numbered migrations before either API process starts using those tables.
  migrate:
    build:
      context: ./xorganam-node-backend
      dockerfile: Dockerfile
    container_name: xorganam-migrate
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@postgres:5432/xorganam
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run db:migrate
    networks: [data]

  backend:
    build:
      context: ./xorganam-node-backend
      dockerfile: Dockerfile
    container_name: xorganam-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@postgres:5432/xorganam
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:${BACKOFFICE_HOST_PORT:-5173},http://localhost:${CHECKOUT_HOST_PORT:-5174},http://localhost:${INSTITUTION_PORTAL_HOST_PORT:-5175}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY in the environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      VAULT_ADDR: ${VAULT_ADDR:?Set VAULT_ADDR in the environment}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?Set VAULT_ROLE_ID in the environment}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:?Set VAULT_SECRET_ID in the environment}
      EGANOW_BASE_URL: ""
      EGANOW_CALLBACK_URL: ${EGANOW_CALLBACK_URL:?Set EGANOW_CALLBACK_URL in the environment}
      EGANOW_DEBUG: "false"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - kyc_uploads:/app/uploads/kyc
    command: npm start
    networks: [app, data]

  backend-worker:
    build:
      context: ./xorganam-node-backend
      dockerfile: Dockerfile
    container_name: xorganam-backend-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@postgres:5432/xorganam
      REDIS_URL: redis://redis:6379
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY in the environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      VAULT_ADDR: ${VAULT_ADDR:?Set VAULT_ADDR in the environment}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?Set VAULT_ROLE_ID in the environment}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:?Set VAULT_SECRET_ID in the environment}
      EGANOW_BASE_URL: ""
      EGANOW_CALLBACK_URL: ${EGANOW_CALLBACK_URL:?Set EGANOW_CALLBACK_URL in the environment}
      EGANOW_DEBUG: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: npm run worker
    networks: [data, egress]

  backoffice-dashboard:
    build:
      context: ./backoffice-dashboard
      dockerfile: Dockerfile.static
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    container_name: xorganam-backoffice-dashboard
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    ports:
      - "127.0.0.1:${BACKOFFICE_HOST_PORT:-5173}:5173"
    networks: [app]

  checkout:
    build:
      context: ./xorganam-checkout
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
        VITE_BUILD_MODE: development
    container_name: xorganam-checkout
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    ports:
      - "127.0.0.1:${CHECKOUT_HOST_PORT:-5174}:5174"
    networks: [app]

  institution-portal:
    build:
      context: ./institution-portal
      dockerfile: Dockerfile.static
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    container_name: xorganam-institution-portal
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-3000}/api/v1
    ports:
      - "127.0.0.1:${INSTITUTION_PORTAL_HOST_PORT:-5175}:5175"
    depends_on:
      - backend
    networks: [app]

volumes:
  xorganam1_postgres_data:
    external: true
  xorganam1_redis_data:
    external: true
  kyc_uploads:

networks:
  app:
  data:
    internal: true
  egress:
